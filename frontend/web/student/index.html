<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursos Disponíveis - ABEMCE</title>
  <link rel="stylesheet" href="/src/css/index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Cabeçalho (Header) do Aluno -->
  <header class="app-header">
    <div class="header-container">
      
      <!-- Logo ABEMCE -->
      <a href="/student/index.html" class="login-logo" style="margin-bottom: 0;">
        <div class="logo-diamond" style="width: 24px; height: 24px;">
          <span style="width: 10px; height: 10px;"></span>
          <span style="width: 10px; height: 10px;"></span>
          <span style="width: 10px; height: 10px;"></span>
          <span style="width: 10px; height: 10px;"></span>
        </div>
        <div class="logo-text" style="font-size: 1.5rem;">abemce</div>
      </a>

      <!-- Menu de Navegação -->
      <nav>
        <ul class="nav-links">
          <li><a href="/student/index.html" class="active">Início</a></li>
          <li><a href="/student/my_courses.html">Meus Cursos</a></li>
          <li><a href="/student/about.html">Sobre a ABEMCE</a></li>
          <li><a href="#" onclick="logout()" class="btn-logout">Sair</a></li>
        </ul>
      </nav>

    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="student-main">
    
    <!-- Hero/Boas-vindas -->
    <section class="student-hero">
      <h2>O que você quer aprender hoje?</h2>
      <p>Cursos de qualificação e formação artística gratuita para a comunidade.</p>
    </section>

    <!-- Pílulas de Filtros de Categorias (Image 3) -->
    <section class="category-filters" id="category-pills">
      <button class="category-pill active" onclick="filterCategory('Todos')">Todos</button>
      <button class="category-pill" onclick="filterCategory('Qualificação profissional')">Qualificação profissional</button>
      <button class="category-pill" onclick="filterCategory('Música (Banda marcial)')">Música (Banda marcial)</button>
      <button class="category-pill" onclick="filterCategory('Esporte')">Esporte</button>
      <button class="category-pill" onclick="filterCategory('Artesanato')">Artesanato</button>
    </section>

    <!-- Grid de Cards de Cursos (Image 3) -->
    <section class="courses-grid" id="courses-container">
      <!-- Cursos serão carregados dinamicamente via JS -->
      <div style="text-align: center; grid-column: 1/-1; padding: 50px; color: var(--text-muted);">
        <i class="fa-solid fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 10px;"></i>
        <p>Carregando cursos disponíveis...</p>
      </div>
    </section>

  </main>

  <div id="toast-msg" class="toast"></div>

  <script>
    let allCourses = [];
    let myEnrollments = [];
    let currentCategory = 'Todos';

    // Verificar Autenticação
    const token = localStorage.getItem('abemce_token');
    const user = JSON.parse(localStorage.getItem('abemce_user'));

    if (!token || !user || user.role !== 'student') {
      localStorage.clear();
      window.location.href = '/index.html';
    }

    // Carregar Cursos e Matrículas ao Iniciar
    async function loadData() {
      try {
        // Buscar inscrições do próprio aluno
        const enrollResponse = await fetch('/api/courses/my-enrollments', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        myEnrollments = await enrollResponse.json();

        // Buscar todos os cursos
        const coursesResponse = await fetch('/api/courses', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        allCourses = await coursesResponse.json();

        renderCourses();
      } catch (error) {
        console.error('Erro de rede:', error);
        showToast('Erro ao carregar dados dos cursos!', 'error');
      }
    }

    // Filtrar Cursos por Categoria
    function filterCategory(category) {
      currentCategory = category;
      
      // Atualizar classe ativa nas pílulas
      const pills = document.querySelectorAll('.category-pill');
      pills.forEach(pill => {
        if (pill.textContent.trim() === category) {
          pill.classList.add('active');
        } else {
          pill.classList.remove('active');
        }
      });

      renderCourses();
    }

    // Renderizar os Cursos no Layout Grid (Image 3)
    function renderCourses() {
      const container = document.getElementById('courses-container');
      
      // Filtrar a lista com base na categoria ativa
      let filtered = allCourses;
      if (currentCategory !== 'Todos') {
        filtered = allCourses.filter(c => c.category.toLowerCase() === currentCategory.toLowerCase());
      }

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; grid-column: 1/-1; padding: 80px 20px; background-color: var(--white); border-radius: var(--radius-md); border: 1px dashed var(--border-color);">
            <i class="fa-solid fa-folder-open" style="font-size: 3rem; color: var(--text-muted); margin-bottom: 15px;"></i>
            <p style="font-weight: 600; color: var(--text-dark);">Nenhum curso disponível nesta categoria no momento.</p>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 5px;">Tente selecionar outra categoria ou volte mais tarde.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(course => {
        // Verificar se aluno já está inscrito neste curso
        const enrolled = myEnrollments.find(e => e.course_id === course.id);
        
        let buttonHtml = '';
        if (enrolled) {
          buttonHtml = `<button class="btn-card enrolled"><i class="fa-solid fa-circle-check"></i> JÁ INSCRITO (Ir para Meus Cursos)</button>`;
        } else {
          const actionText = course.title.toLowerCase().includes('jovem') ? 'VER VAGAS' : 'INSCREVER-SE';
          buttonHtml = `<button class="btn-card" onclick="enrollCourse(${course.id}, '${course.title}')">${actionText}</button>`;
        }

        // Tag superior esquerda para fidelidade visual do print (amarela)
        const tagHtml = `<span class="course-tag">QUALIFICAÇÃO</span>`;

        // Atribuir imagens representativas baseadas no título para wow-factor estético
        let imgUrl = course.image_url;
        if (course.title.toLowerCase().includes('oportunidades') || course.title.toLowerCase().includes('costura')) {
          imgUrl = 'https://images.unsplash.com/photo-1544816155-12df9643f363?auto=format&fit=crop&q=80&w=600'; // Costura/Confecção
        } else if (course.title.toLowerCase().includes('aprendiz')) {
          imgUrl = 'https://images.unsplash.com/photo-1531482615713-2afd69097998?auto=format&fit=crop&q=80&w=600'; // Computador/Sala de Aula
        } else if (course.title.toLowerCase().includes('música') || course.title.toLowerCase().includes('musical')) {
          imgUrl = 'https://images.unsplash.com/photo-1465847899084-d164df4dedc6?auto=format&fit=crop&q=80&w=600'; // Trompetes/Banda
        } else if (!imgUrl || imgUrl.startsWith('/src')) {
          imgUrl = 'https://images.unsplash.com/photo-1524178232363-1fb2b075b655?auto=format&fit=crop&q=80&w=600'; // Default educação
        }

        return `
          <div class="course-card">
            <div class="course-img-wrapper">
              <img src="${imgUrl}" alt="${course.title}" class="course-img">
              ${tagHtml}
            </div>
            <div class="course-body">
              <h3 class="course-title">${course.title}</h3>
              <p class="course-desc">${course.description}</p>
              <div style="margin-top: auto;">
                ${buttonHtml}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Efetuar Inscrição no Curso (RF04)
    async function enrollCourse(courseId, courseTitle) {
      try {
        const response = await fetch(`/api/courses/${courseId}/enroll`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          }
        });

        const data = await response.json();

        if (!response.ok) {
          showToast(data.error || 'Erro ao realizar inscrição.', 'error');
          return;
        }

        showToast(`Inscrição no curso "${courseTitle}" concluída com sucesso!`, 'success');
        
        // Recarregar dados para atualizar o estado do botão
        setTimeout(() => {
          loadData();
        }, 800);

      } catch (error) {
        console.error('Erro de conexão:', error);
        showToast('Erro ao conectar ao servidor. Tente novamente!', 'error');
      }
    }

    // Efetuar Logout
    function logout() {
      localStorage.clear();
      window.location.href = '/index.html';
    }

    function showToast(message, type = 'success') {
      toastMsg.textContent = message;
      toastMsg.className = `toast ${type}`;
      toastMsg.style.display = 'block';
      setTimeout(() => {
        toastMsg.style.display = 'none';
      }, 3000);
    }

    // Inicialização
    loadData();
  </script>
</body>
</html>
