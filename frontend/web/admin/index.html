<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/src/css/index.css">
    <title>Painel Administrativo - ABEMCE</title>
  </head>

  <body>
    <div class="admin-layout">
      <aside class="admin-sidebar">
        <div class="sidebar-logo">
          <a href="/admin/index.html" class="logo-text" style="color: var(--white); font-size: 1.6rem;">
            ABEM<span>CE</span> <span style="font-weight: 400; color: #a4b0be; font-size: 1.2rem;">Admin</span>
          </a>
        </div>

        <ul class="sidebar-menu">
          <li>
            <a href="/admin/index.html" class="sidebar-link active">
              <i class="fa-solid fa-house"></i>
              <span>Início</span>
            </a>
          </li>

          <li>
            <a href="/admin/add_course.html" class="sidebar-link">
              <i class="fa-solid fa-plus-circle"></i>
              <span>Cadastrar cursos</span>
            </a>
          </li>

          <li>
            <a href="/admin/students.html" class="sidebar-link">
              <i class="fa-solid fa-users"></i>
              <span>Gestão de alunos</span>
            </a>
          </li>
        </ul>

        <div class="sidebar-footer">
          <a href="#" onclick="logout()" class="sidebar-link" style="color: #ff6b6b;">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Sair da Conta</span>
          </a>
        </div>
      </aside>

      <main class="admin-content">        
        <section class="admin-header">
          <div>
            <h2>Painel de Gestão de alunos</h2>
          </div>
          <button onclick="exportReport()" class="btn-export">
            <i class="fa-solid fa-file-export"></i>
            Exportar relatório
          </button>
        </section>

        <section class="metrics-grid">
          <div class="metric-card">
            <span class="metric-label">Alunos inscritos</span>
            <span class="metric-value" id="metric-students">---</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">Cursos ativos</span>
            <span class="metric-value" id="metric-courses">---</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">Jovens aprendizes</span>
            <span class="metric-value" id="metric-jovens">---</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">Formação musical</span>
            <span class="metric-value" id="metric-musica">---</span>
          </div>
        </section>

        <section class="admin-section">
          <h3 class="section-title">Inscrições recentes</h3>
          
          <div class="table-wrapper">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Aluno</th>
                  <th>Programa</th>
                  <th>Bairro (Fortaleza)</th>
                  <th>Data da Inscrição</th>
                </tr>
              </thead>

              <tbody id="enrollments-tbody">
                <tr>
                  <td colspan="4" style="text-align: center; color: var(--text-muted); padding: 40px;">
                    <i class="fa-solid fa-spinner fa-spin" style="font-size: 1.5rem; margin-bottom: 8px;"></i>
                    <p>Carregando matrículas recentes...</p>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <div id="toast-msg" class="toast"></div>

    <script src="../../javascript/indexAdmin.js"></script>
  </body>
</html>
