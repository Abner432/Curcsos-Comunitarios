<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo - ABEMCE</title>
  <link rel="stylesheet" href="/src/css/index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="admin-layout">
    
    <!-- Barra Lateral (Sidebar) - Image 2 -->
    <aside class="admin-sidebar">
      <div class="sidebar-logo">
        <a href="/admin/index.html" class="logo-text" style="color: var(--white); font-size: 1.6rem;">
          ABEM<span>CE</span> <span style="font-weight: 400; color: #a4b0be; font-size: 1.2rem;">Admin</span>
        </a>
      </div>

      <ul class="sidebar-menu">
        <li>
          <a href="/admin/index.html" class="sidebar-link active">
            <i class="fa-solid fa-house"></i>
            <span>Início</span>
          </a>
        </li>
        <li>
          <a href="/admin/add_course.html" class="sidebar-link">
            <i class="fa-solid fa-plus-circle"></i>
            <span>Cadastrar cursos</span>
          </a>
        </li>
        <li>
          <a href="/admin/students.html" class="sidebar-link">
            <i class="fa-solid fa-users"></i>
            <span>Gestão de alunos</span>
          </a>
        </li>
      </ul>

      <div class="sidebar-footer">
        <a href="#" onclick="logout()" class="sidebar-link" style="color: #ff6b6b;">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span>Sair da Conta</span>
        </a>
      </div>
    </aside>

    <!-- Área de Conteúdo Principal -->
    <main class="admin-content">
      
      <!-- Cabeçalho Administrativo -->
      <section class="admin-header">
        <div>
          <h2>Painel de Gestão de alunos</h2>
        </div>
        <button onclick="exportReport()" class="btn-export">
          <i class="fa-solid fa-file-export"></i>
          Exportar relatório
        </button>
      </section>

      <!-- Grade de Métricas Pedagógicas (Cards do Print 2) -->
      <section class="metrics-grid">
        <div class="metric-card">
          <span class="metric-label">Alunos inscritos</span>
          <span class="metric-value" id="metric-students">---</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">Cursos ativos</span>
          <span class="metric-value" id="metric-courses">---</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">Jovens aprendizes</span>
          <span class="metric-value" id="metric-jovens">---</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">Formação musical</span>
          <span class="metric-value" id="metric-musica">---</span>
        </div>
      </section>

      <!-- Tabela de Inscrições Recentes (Print 2) -->
      <section class="admin-section">
        <h3 class="section-title">Inscrições recentes</h3>
        
        <div class="table-wrapper">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Aluno</th>
                <th>Programa</th>
                <th>Bairro (Fortaleza)</th>
                <th>Data da Inscrição</th>
              </tr>
            </thead>
            <tbody id="enrollments-tbody">
              <!-- Matrículas carregadas via API -->
              <tr>
                <td colspan="4" style="text-align: center; color: var(--text-muted); padding: 40px;">
                  <i class="fa-solid fa-spinner fa-spin" style="font-size: 1.5rem; margin-bottom: 8px;"></i>
                  <p>Carregando matrículas recentes...</p>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

    </main>

  </div>

  <div id="toast-msg" class="toast"></div>

  <script>
    // Verificar Autenticação
    const token = localStorage.getItem('abemce_token');
    const user = JSON.parse(localStorage.getItem('abemce_user'));

    if (!token || !user || user.role !== 'admin') {
      localStorage.clear();
      window.location.href = '/index.html';
    }

    // Carregar Métricas e Inscrições Recentes
    async function loadAdminData() {
      try {
        // 1. Carregar Métricas
        const metricsResponse = await fetch('/api/admin/metrics', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const metrics = await metricsResponse.json();
        
        document.getElementById('metric-students').textContent = metrics.totalStudents;
        document.getElementById('metric-courses').textContent = metrics.activeCourses;
        document.getElementById('metric-jovens').textContent = metrics.jovensAprendizes;
        document.getElementById('metric-musica').textContent = metrics.formacaoMusical;

        // 2. Carregar Matrículas Recentes (Tabela)
        const enrollResponse = await fetch('/api/admin/enrollments', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const enrollments = await enrollResponse.json();
        
        renderEnrollments(enrollments);

      } catch (error) {
        console.error(error);
        showToast('Erro ao carregar dados do painel administrativo.', 'error');
      }
    }

    // Renderizar linhas da tabela
    function renderEnrollments(list) {
      const tbody = document.getElementById('enrollments-tbody');
      
      if (list.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="4" style="text-align: center; color: var(--text-muted); padding: 40px;">
              Nenhum aluno matriculado até o momento.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = list.map(item => {
        const rawDate = new Date(item.enrollmentDate);
        // Formatar data: DD/MM/AAAA
        const formattedDate = rawDate.toLocaleDateString('pt-BR', {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric'
        });

        return `
          <tr>
            <td style="font-weight: 600;">${item.studentName}</td>
            <td>${item.courseTitle}</td>
            <td>${item.neighborhood}</td>
            <td>${formattedDate}</td>
          </tr>
        `;
      }).join('');
    }

    // Exportar relatório
    async function exportReport() {
      try {
        const response = await fetch('/api/admin/export-report', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        
        if (!response.ok) throw new Error();

        const data = await response.json();
        
        // Simular o download do arquivo convertendo JSON para blob e forçando o download no browser!
        const jsonStr = JSON.stringify(data, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'relatorio_alunos_abemce.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        
        showToast('Relatório pedagógico exportado com sucesso!', 'success');
      } catch (error) {
        showToast('Erro ao exportar relatório.', 'error');
      }
    }

    // Efetuar Logout
    function logout() {
      localStorage.clear();
      window.location.href = '/index.html';
    }

    function showToast(message, type = 'success') {
      toastMsg.textContent = message;
      toastMsg.className = `toast ${type}`;
      toastMsg.style.display = 'block';
      setTimeout(() => {
        toastMsg.style.display = 'none';
      }, 3000);
    }

    loadAdminData();
  </script>
</body>
</html>
